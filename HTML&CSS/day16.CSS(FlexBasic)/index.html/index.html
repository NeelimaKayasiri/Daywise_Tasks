<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle {
            height: 800px;
            width: 800px;
            border: 5px solid rgb(24, 102, 63);
            border-radius: 50%;
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: rgb(118, 234, 151);

        }
        .circle1 {
            height: 600px;
            width: 600px;
            border: 5px solid black;
            border-radius: 50%;
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: rgb(224, 235, 78);
        }
        .circle2{
            height: 400px;
            width: 400px;
            border: 5px solid rgb(18, 33, 193);
            border-radius: 50%;
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: pink;
        }
        .circle3 {
            height: 200px;
            width: 200px;
            border: 5px solid rgb(193, 18, 105);
            border-radius: 50%;
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: lightblue;

        }
    </style>
</head>
<body>
    <div class="circle">
        <div class="circle1">
            <div class="circle2">
                <div class="circle3">
                    <h2>Full Stack <br> Developer</h2>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
